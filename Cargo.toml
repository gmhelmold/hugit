[workspace]
members = ["crates/*", "crates/hugit-app/ui", "crates/hugit-app/exit", "crates/hugit-dogfood"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license-file = "LICENSE"

[workspace.dependencies]
# Serialization
serde      = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

# Cryptography — exact-pinned for supply-chain invariant (X4)
sha2         = "=0.10.9"
hmac         = "=0.12.1"
hex          = "=0.4.3"
# CoreLink CAS content-address digest: BLAKE3-256 → 64-hex (confirmed contract,
# CoreLink Server TL 2026-06-18). Used by `hugit-serve`'s git-from-CAS read path +
# ingest bin to compute the CAS key over the loose-object framing. SIMD/rayon
# default features OFF — we hash small loose objects, not multi-GB streams.
blake3       = { version = "=1.5.5", default-features = false }
base64       = "=0.22.1"
ed25519-dalek = "=2.1.1"

# Error handling
thiserror = "=2.0.18"
anyhow    = "=1.0.102"

# HTTP
ureq = "=2.12.1"

# Semantic index / symbol outline (W6, hugit-symbols). tree-sitter + the Rust
# grammar compile a vendored C grammar via `cc` (already a workspace build-dep
# via blake3/libgit2-sys/libz-sys/ring) — C *grammar* source, not a new toolchain
# class. Exact-pinned per the X4 supply-chain invariant; licenses MIT / MIT OR
# Apache-2.0 (deny-clear). streaming-iterator is required by tree-sitter 0.26's
# lending query-cursor API.
tree-sitter        = "=0.26.9"
tree-sitter-rust   = "=0.24.2"
streaming-iterator = "=0.1.9"
