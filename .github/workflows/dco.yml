name: DCO

on:
  # Fork-guard note (PS-5, WF-DOCS): see ci.yml for full rationale.
  # Same accepted risk applies here (private repo; LOW). If public: same fix.
  pull_request:

permissions:
  contents: read

# Collapse duplicate runs for the same ref to one (cancel the older).
concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    # GitHub-hosted (2026-06-19: org Actions billing unblocked — owner). Pure
    # git/shell job, fully portable; off the contention-flaky self-hosted Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Enforce Signed-off-by trailer
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          missing=0
          # --no-merges: pull_request checkouts sit on GitHub's synthetic,
          # never-signed merge commit; real merge commits are exempt too.
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            body=$(git log -1 --format="%B" "$sha")
            if ! echo "$body" | grep -q "^Signed-off-by:"; then
              echo "ERROR: commit $sha is missing a Signed-off-by: trailer"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "DCO check failed: $missing commit(s) lack a Signed-off-by: trailer."
            echo "Please add 'Signed-off-by: Your Name <email>' to each commit (use git commit -s)."
            exit 1
          fi
          echo "DCO check passed: all commits have Signed-off-by: trailers."
