name: DCO

on:
  # Fork-guard (PS-5, WF-DOCS): the `dco` job carries
  #   if: github.event.pull_request.head.repo.fork == false
  # so forked PRs never run on the self-hosted runner. See ci.yml for rationale.
  pull_request:

permissions:
  contents: read

# Collapse duplicate runs for the same ref to one (cancel the older).
concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dco:
    # GitHub-hosted ubuntu (re-migrated 2026-07-09 with ci.yml — off the shared dev
    # box so CI stops contending with local dev/agent builds; the 2026-06-29 self-hosted
    # revert was a transient hosted-pool outage, now past). Pure git/shell job, portable.
    # Fork-guard: skip PRs from forks. Revert to `[self-hosted, macOS]` on a pool outage.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Enforce Signed-off-by trailer
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          missing=0
          # --no-merges: pull_request checkouts sit on GitHub's synthetic,
          # never-signed merge commit; real merge commits are exempt too.
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            body=$(git log -1 --format="%B" "$sha")
            if ! echo "$body" | grep -q "^Signed-off-by:"; then
              echo "ERROR: commit $sha is missing a Signed-off-by: trailer"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "DCO check failed: $missing commit(s) lack a Signed-off-by: trailer."
            echo "Please add 'Signed-off-by: Your Name <email>' to each commit (use git commit -s)."
            exit 1
          fi
          echo "DCO check passed: all commits have Signed-off-by: trailers."
