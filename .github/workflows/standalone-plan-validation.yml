name: Standalone plan validation

on:
  pull_request:
    paths:
      - 'docs/plan/standalone/**'
      - 'scripts/plan/**'
      - 'scripts/acceptance/**'
      - 'docs/audit/**'
      - '.github/workflows/standalone-plan-validation.yml'
  push:
    branches: [main]
    paths:
      - 'docs/plan/standalone/**'
      - 'scripts/plan/**'
      - 'scripts/acceptance/**'
      - 'docs/audit/**'
      - '.github/workflows/standalone-plan-validation.yml'

permissions:
  contents: read

concurrency:
  group: standalone-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate canonical plan and generated issue projection
        run: python3 scripts/plan/check_import.py
      - name: Exercise importer controls without GitHub mutations
        run: python3 scripts/plan/test_sync.py
      - name: Verify retained baseline observations (not a new product run)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(mktemp -d)
          trap 'rm -rf "$SOURCE"' EXIT
          # Historical assertions must not freeze future product edits.
          git archive ce2fcf1b8243eea2bd1be5aff25dfb3f6571ead4 \
            crates/hugit-cli/src/checks/run.rs \
            docs/review/round13/wedge-decider.md \
            docs/plan/standalone/v3/work-packages/HUG-012.md \
            docs/plan/standalone/v3/work-packages/HUG-013.md \
            crates/hugit-queue/src/core/union.rs \
            docs/plan/standalone/v3/work-packages/HUG-014.md \
            docs/plan/standalone/v3/work-packages/HUG-009.md \
            docs/plan/standalone/v3/work-packages/HUG-026.md \
            crates/hugit-cli/src/capture/mod.rs \
            crates/hugit-cli/src/capture/drain.rs \
            crates/hugit-cli/src/porcelain.rs \
            crates/hugit-cli/src/export/redaction.rs \
            crates/hugit-cli/src/main.rs \
            crates/hugit-cli/src/pr/filelock.rs \
            crates/hugit-cli/src/pr/cli.rs \
            crates/hugit-cli/src/pr/dispatch.rs \
            crates/hugit-cli/src/capture/receipt.rs \
            crates/hugit-cli/src/init/mod.rs \
            crates/hugit-refstore/src/tamper/mod.rs \
            crates/hugit-mcp/src/server.rs \
            crates/hugit-mcp/src/lib.rs \
            .github/workflows/ci.yml \
            .github/workflows/release.yml \
            Cargo.toml \
            crates/hugit-cli/Cargo.toml \
            | tar -x -C "$SOURCE"
          python3 scripts/acceptance/baseline_oracles.py \
            --report docs/audit/baseline-results.json --root "$SOURCE" --self-test \
            | tee "$RUNNER_TEMP/hug003-retained-oracles.json"
      - name: Retain baseline evidence consistency result (not product approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hug003-retained-oracles-${{ github.sha }}
          path: ${{ runner.temp }}/hug003-retained-oracles.json
          if-no-files-found: error
          retention-days: 90
      - name: Test bounded acquisition verifier with isolated Git fixtures
        run: python3 scripts/plan/test_inventory.py
      - name: Verify historical acquisition and surface contracts against pinned Git source
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          mkdir "$TMP/source"
          SUBJECT=$(python3 -c 'import json,re; s=json.load(open("docs/audit/source-inventory.json"))["source_commit"]; assert re.fullmatch("[0-9a-f]{40}",s); print(s)')
          TREE=$(git rev-parse --verify "${SUBJECT}^{tree}")
          git archive "$SUBJECT" | tar -x -C "$TMP/source"
          git ls-tree -r -z "$SUBJECT" > "$TMP/tree.z"
          GIT_INDEX_FILE="$TMP/index" git -c core.hooksPath=/dev/null read-tree "$SUBJECT"
          GIT_INDEX_FILE="$TMP/index" git ls-files --stage -z > "$TMP/index.z"
          verify() {
            python3 scripts/plan/verify_inventory.py \
              --source "$TMP/source" \
              --inventory docs/audit/source-inventory.json \
              --bindings docs/audit/path-bindings.json \
              --plan "$TMP/source/docs/plan/standalone/v3/backlog.json" \
              --index "$TMP/index.z" --tree "$TMP/tree.z" --expected-tree "$TREE"
          }
          verify > "$RUNNER_TEMP/hug001-acquisition.json"
          verify > "$TMP/repeated.json"
          cmp "$RUNNER_TEMP/hug001-acquisition.json" "$TMP/repeated.json"
          git show 5dcd4355c8ed896e168f7181e1d5add806ef6aaf:docs/audit/reachability.json > "$TMP/basis.json"
          python3 scripts/plan/verify_surface_contracts.py \
            --source "$TMP/source" --basis "$TMP/basis.json" \
            --report "$RUNNER_TEMP/hug001-surfaces.json"
          python3 scripts/plan/verify_surface_contracts.py \
            --source "$TMP/source" --basis "$TMP/basis.json" \
            --report "$TMP/surfaces-repeated.json"
          cmp "$RUNNER_TEMP/hug001-surfaces.json" "$TMP/surfaces-repeated.json"
          python3 scripts/plan/test_surface_contracts.py \
            --source "$TMP/source" --basis "$TMP/basis.json" -v \
            2>&1 | tee "$RUNNER_TEMP/hug001-surface-tests.txt"
          python3 scripts/plan/verify_automation.py \
            --source "$TMP/source" --report "$RUNNER_TEMP/hug001-automation.json"
          python3 scripts/plan/verify_automation.py \
            --source "$TMP/source" --report "$TMP/automation-repeated.json"
          cmp "$RUNNER_TEMP/hug001-automation.json" "$TMP/automation-repeated.json"
          python3 scripts/plan/test_automation.py --source "$TMP/source" -v \
            2>&1 | tee "$RUNNER_TEMP/hug001-automation-tests.txt"
          git for-each-ref --format='%(refname) %(objectname)' > "$TMP/refs-before"
          git status --porcelain=v1 --untracked-files=all > "$TMP/worktree-before"
          git show d6f311e2a3521013f0f2cc2477fa716f7ca0f925:docs/audit/reachability.json > "$TMP/curation.json"
          export PYTHONDONTWRITEBYTECODE=1
          python3 scripts/plan/resolve_wrapper_tests.py --source "$TMP/source" \
            --inventory docs/audit/source-inventory.json --basis "$TMP/basis.json" \
            --out "$RUNNER_TEMP/hug001-wrapper-bindings.json"
          python3 scripts/plan/test_wrapper_resolution.py --source "$TMP/source" \
            --inventory docs/audit/source-inventory.json --basis "$TMP/basis.json" -v \
            2>&1 | tee "$RUNNER_TEMP/hug001-wrapper-tests.txt"
          python3 -c 'import hashlib,sys; actual=hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest(); assert actual=="a483bc4e03065900d39926714c37f3b7df7513d9bbd7c2d54403631724ade2eb", "wrapper report drift"' "$RUNNER_TEMP/hug001-wrapper-bindings.json"
          python3 scripts/plan/recover_inventory.py \
            --source "$TMP/source" --tree "$TMP/tree.z" --index "$TMP/index.z" \
            --basis "$TMP/basis.json" --curation "$TMP/curation.json" \
            --out "$RUNNER_TEMP/hug001-rebuilt" > "$RUNNER_TEMP/hug001-rebuild-command.json"
          python3 scripts/plan/test_recover_inventory.py --root "$GITHUB_WORKSPACE" \
            --source "$TMP/source" --tree "$TMP/tree.z" --index "$TMP/index.z" \
            --basis "$TMP/basis.json" --curation "$TMP/curation.json" \
            --report "$RUNNER_TEMP/hug001-recovery.json" \
            2>&1 | tee "$RUNNER_TEMP/hug001-recovery-tests.txt"
          verify > "$TMP/after-recovery.json"
          cmp "$RUNNER_TEMP/hug001-acquisition.json" "$TMP/after-recovery.json"
          git for-each-ref --format='%(refname) %(objectname)' > "$TMP/refs-after"
          git status --porcelain=v1 --untracked-files=all > "$TMP/worktree-after"
          cmp "$TMP/refs-before" "$TMP/refs-after"
          cmp "$TMP/worktree-before" "$TMP/worktree-after"
          printf '%s\n' '{"source_reverified":true,"refs_unchanged":true,"worktree_status_unchanged":true,"whole_wp_ready":false}' > "$RUNNER_TEMP/hug001-recovery-state.json"
          printf '%s\n' "unexpected file" > "$TMP/source/unclassified-inventory-control"
          if verify > "$TMP/negative.json"; then
            echo "ERROR: unclassified file was accepted" >&2
            exit 1
          fi
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["valid"] is False and r["error"]=="SOURCE_SET_MISMATCH"' "$TMP/negative.json"
          cat "$RUNNER_TEMP/hug001-acquisition.json"
      - name: Retain inventory verification (not work-package approval)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hug001-acquisition-check-${{ github.sha }}
          path: |
            ${{ runner.temp }}/hug001-acquisition.json
            ${{ runner.temp }}/hug001-surfaces.json
            ${{ runner.temp }}/hug001-surface-tests.txt
            ${{ runner.temp }}/hug001-automation.json
            ${{ runner.temp }}/hug001-automation-tests.txt
            ${{ runner.temp }}/hug001-rebuilt/
            ${{ runner.temp }}/hug001-rebuild-command.json
            ${{ runner.temp }}/hug001-recovery.json
            ${{ runner.temp }}/hug001-recovery-tests.txt
            ${{ runner.temp }}/hug001-recovery-state.json
            ${{ runner.temp }}/hug001-wrapper-bindings.json
            ${{ runner.temp }}/hug001-wrapper-tests.txt
          if-no-files-found: error
          retention-days: 30
