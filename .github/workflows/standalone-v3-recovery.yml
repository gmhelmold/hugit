name: Recover approved standalone v3 import
on:
  push:
    branches: [plan/import-standalone-v3-recovery]
    paths:
      - .plan-bootstrap/**
      - .github/workflows/standalone-v3-recovery.yml
permissions:
  contents: write
  issues: write
concurrency:
  group: hugit-standalone-v3-import
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'gmhelmold/hugit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Recover exact approved source and scripts
        run: |
          cp .plan-bootstrap/recover_exact.py "$RUNNER_TEMP/hugit-recover.py"
          python3 "$RUNNER_TEMP/hugit-recover.py" recover "$RUNNER_TEMP/hugit-recovered.json"
      - name: Install and validate only the planning branch
        run: |
          git fetch origin plan/standalone-v3
          git checkout -B plan/standalone-v3 origin/plan/standalone-v3
          python3 "$RUNNER_TEMP/hugit-recover.py" install "$RUNNER_TEMP/hugit-recovered.json"
          python3 scripts/plan/check_import.py
          python3 scripts/plan/test_sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plan/standalone scripts/plan .github/PULL_REQUEST_TEMPLATE/standalone-work-package.md .github/ISSUE_TEMPLATE/standalone-plan-change.yml
          if ! git diff --cached --quiet; then
            git commit -s -m 'docs(plan): import byte-identical standalone v3 contracts and validators'
            git push origin HEAD:refs/heads/plan/standalone-v3
          fi
          SPEC_SHA=$(git log -1 --format=%H -- docs/plan/standalone/v3/backlog.json)
          echo "SPEC_SHA=$SPEC_SHA" >> "$GITHUB_ENV"
      - name: Create and verify WP issues and native relationships
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        run: |
          python3 scripts/plan/sync_github.py --spec-commit "$SPEC_SHA" --dry-run-dir "$RUNNER_TEMP/hugit-preview" --apply | tee "$RUNNER_TEMP/import-summary.json"
      - name: Commit verified operational map
        run: |
          python3 scripts/plan/check_import.py
          python3 scripts/plan/test_sync.py
          git add docs/plan/standalone/github/issue-map.json
          if ! git diff --cached --quiet; then
            git commit -s -m 'docs(plan): record verified issue IDs and native dependency graph'
            git push origin HEAD:refs/heads/plan/standalone-v3
          fi
      - name: Retain import evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hugit-plan-import-report
          path: |
            docs/plan/standalone/github/issue-map.json
            ${{ runner.temp }}/import-summary.json
          if-no-files-found: warn
