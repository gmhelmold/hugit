name: Native coordination (platform matrix)

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-coordination.yml'
      - 'scripts/qualify_native_coordination.py'
      - 'scripts/test_native_coordination_evidence.py'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/native-coordination.yml'
      - 'scripts/qualify_native_coordination.py'
      - 'scripts/test_native_coordination_evidence.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-coordination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.cell }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: linux-x64-ext4
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - cell: macos-arm64-apfs
            runner: macos-15
            target: aarch64-apple-darwin
            python: python3
          - cell: macos-intel-apfs
            runner: macos-15-intel
            target: x86_64-apple-darwin
            python: python3
          - cell: windows-x64-ntfs
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON: ${{ matrix.python }}
      NATIVE_CELL: ${{ matrix.cell }}
      NATIVE_TARGET: ${{ matrix.target }}
      SUBJECT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Prepare isolated directories
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" - <<'PYPREP'
          import json, os, pathlib
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          fixtures = base / 'hugit-native-fixtures'
          evidence = base / 'hugit-native-coordination'
          fixtures.mkdir()
          evidence.mkdir()
          (evidence / 'execution.json').write_text(json.dumps({
              'cell': os.environ['NATIVE_CELL'], 'run': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'status': 'not_yet_qualified'})+'\n')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              for key in ('TMPDIR', 'TEMP', 'TMP', 'NATIVE_FIXTURES'):
                  env.write(f'{key}={fixtures}\n')
              env.write(f'EVIDENCE_DIR={evidence}\n')
          PYPREP
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: native-coordination-${{ matrix.cell }}-v2
      - name: Check evidence gate controls
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON" scripts/test_native_coordination_evidence.py 2>&1 | tee "$EVIDENCE_DIR/gate-controls.log"
      - name: Identify actual native platform and fixture filesystem
        shell: bash
        run: '"$PYTHON" scripts/qualify_native_coordination.py identify --cell "$NATIVE_CELL"'
      - name: Execute native lease and process scenarios
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --target "$NATIVE_TARGET" -p hugit-refstore --lib coordination::release_regressions -- --list 2>&1 | tee "$EVIDENCE_DIR/unit-list.log"
          cargo test --locked --target "$NATIVE_TARGET" -p hugit-refstore --lib coordination::release_regressions -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/unit.log"
          cargo test --locked --target "$NATIVE_TARGET" -p hugit-cli --test lock_protocol_v2 -- --list 2>&1 | tee "$EVIDENCE_DIR/integration-list.log"
          cargo test --locked --target "$NATIVE_TARGET" -p hugit-cli --test lock_protocol_v2 -- --nocapture 2>&1 | tee "$EVIDENCE_DIR/integration.log"
      - name: Require mandatory names, applicable pause and fixture cleanup
        shell: bash
        run: '"$PYTHON" scripts/qualify_native_coordination.py verify --cell "$NATIVE_CELL"'
      - name: Retain evidence even when qualification fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-coordination-${{ matrix.cell }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hugit-native-coordination/
          if-no-files-found: error
          retention-days: 90
