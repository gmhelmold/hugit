name: CI

on:
  # Fork-guard note (PS-5, WF-DOCS): `pull_request` runs fork code on the
  # self-hosted runner. Accepted risk: this repo is PRIVATE — fork PRs require
  # write access; no external contributors. Risk = LOW.
  # If the repo goes public: switch to `pull_request_target` with a protected
  # environment approval gate, or add a fork-origin guard:
  #   if: github.event.pull_request.head.repo.fork == false
  # to prevent untrusted fork code from running on the corelink-builder machine.
  # Docs-only changes do NOT run CI (owner directive 2026-06-12): a change whose
  # files ALL match these globs skips the runner entirely — no point burning a
  # ~14-24 min self-hosted cycle to "verify" markdown. A change that touches ANY
  # non-doc file (code, Cargo.toml, .github/, conformance vectors) still runs.
  # (Safe: `main` has no required-status-check branch protection, so a path-filter
  # skip cannot leave a PR "pending forever".)
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  gates:
    # HuGR family CI runs on the self-hosted fleet, never GitHub-hosted
    # (same labels as corelink-server; ubuntu-latest was a founding mistake
    # that hit the org's Actions billing wall).
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154  # v2
        with:
          tool: cargo-audit,cargo-deny

      # Each gate step puts cargo on PATH itself rather than relying on the
      # toolchain action's `$GITHUB_PATH` entry — that propagation is
      # intermittently lost per-step on the shared self-hosted runner (observed
      # `cargo: command not found` in `test` while `fmt`/`clippy` in the SAME run
      # found it; ~37% flake, PS-12-class infra). `~/.cargo/bin` holds the rustup
      # cargo shim + the taiki-e-installed `cargo-deny`/`cargo-audit`, so this is
      # additive + bulletproof against the runner's flaky PATH propagation.
      - name: fmt
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo fmt --all --check

      - name: clippy
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --workspace --locked

      - name: deny
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo deny check

      - name: audit
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo audit --deny warnings

      - name: changelog gate
        if: github.event_name == 'pull_request'
        run: .github/scripts/changelog-gate.sh "${{ github.event.pull_request.base.sha }}" HEAD
