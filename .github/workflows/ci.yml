name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gates:
    # HuGR family CI runs on the self-hosted fleet, never GitHub-hosted
    # (same labels as corelink-server; ubuntu-latest was a founding mistake
    # that hit the org's Actions billing wall).
    runs-on: [self-hosted, mac, corelink-builder]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2

      - uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154  # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked

      - name: deny
        run: cargo deny check

      - name: audit
        run: cargo audit --deny warnings

      - name: changelog gate
        if: github.event_name == 'pull_request'
        run: .github/scripts/changelog-gate.sh "${{ github.event.pull_request.base.sha }}" HEAD
