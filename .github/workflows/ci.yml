name: CI

on:
  # Fork-guard (PS-5, WF-DOCS): the `gates` job carries
  #   if: github.event.pull_request.head.repo.fork == false
  # so forked PRs never run untrusted code on the self-hosted runner.
  # Push events (maintainer-owned refs) are unaffected.
  # `pull_request_target` was considered but rejected: it runs with base-repo
  # secrets in scope, making it strictly riskier than the fork-guard approach.
  # Stacked-PR CI economy (owner, 2026-09-04): the full workspace gate runs at
  # the MERGE POINT (every push to `main` below), not on every stacked PR. A PR
  # whose change is self-contained (e.g. hugit-cli alone, with its own acceptance
  # tests) is gated locally + its crate suite; only a change whose blast radius
  # SPANS THE WORKSPACE — frozen contracts, conformance vectors, workspace wiring,
  # the served engine, CI itself — runs the full gate on the PR. Docs-only and
  # self-contained PRs skip entirely (repo has no branch protection, so a skip
  # cannot leave a PR "pending forever" — same rationale as the old doc-skip).
  pull_request:
    paths:
      - 'crates/hugit-contracts/**'
      - 'crates/hugit-cli/**'
      - 'crates/hugit-refstore/**'
      - 'crates/hugit-invariants/**'
      - 'conformance/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - '.github/workflows/ci.yml'
  # The authoritative full gate: EVERY merge to `main` runs the whole workspace
  # (fmt + clippy --workspace --all-targets --locked -D warnings + test
  # --workspace --locked + deny + audit). This is the merge point you can rely on.
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Manual dispatch: lets maintainers run the full gate on a PR branch
  # directly (bypasses event routing), with the same jobs + secrets scope
  # as a push/PR run on a trust-source ref.
  workflow_dispatch:

permissions:
  contents: read

# Collapse duplicate runs for the same ref to one (cancel the older). Guards
# against double-triggered events (e.g. the humangr-labs→HumanGuardrail rename
# fired dual push/PR events → two gates runs that canceled each other).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # GitHub-hosted ubuntu (2026-06-26: owner re-enabled paid Actions credit —
    # "pode rodar no github actions, tem credito la"). RE-MIGRATED off the self-hosted
    # Mac, which shares ONE dev box with the local dev session + sibling repos' runners:
    # local `cargo` (esp. full-workspace gates) and sibling CI starve the in-flight run
    # (a PR sat `pending` >60 min on 2026-06-26). ubuntu-hosted runners are ephemeral +
    # isolated → no cross-job contention, runs in parallel, ~8-min cycle.
    # (The self-hosted billing-cap revert was 2026-06-21; the original ubuntu migration
    # was #155. The CARGO_HOME-isolation + per-step PATH-glob steps below are now no-ops
    # but harmless on ubuntu — the `1.96.0-*` glob resolves to the linux toolchain dir;
    # left in place to keep this diff minimal, can be simplified later.)
    # Fork-guard: only run for maintainer PRs (same repo) + push events; fork PRs are
    # trusted-source only (kept as defense even on ephemeral hosted runners).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    # GitHub-hosted ubuntu (re-migrated 2026-07-09). The self-hosted macOS builder
    # (hugit-builder-01) shares ONE dev box with the local dev session + sibling
    # runners, so CI serialized behind local `cargo` + sibling CI under contention
    # (the exact starvation the 2026-06-26 migration fixed; the 2026-06-29 revert was
    # forced ONLY by a transient hosted-pool outage, now past). Hosted runners are
    # ephemeral + isolated → CI runs in parallel off the dev box, ~8-min cycle. The
    # workspace is cross-platform; the fork-guard above keeps fork PRs off any runner.
    # (If the hosted pool outages again — jobs completing-failure with ZERO steps —
    # revert this ONE line to `[self-hosted, macOS]`.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable (pinned)
        with:
          toolchain: "1.96.0"
          components: rustfmt,clippy

      # Isolate hugit's CARGO_HOME from the shared `~/.cargo`. This box runs MANY
      # self-hosted runners (sibling repos: corelink-server, githugr, wallet, …);
      # they all default to `$HOME/.cargo`, so a sibling's CI fan-out extracting
      # the registry CONCURRENTLY with ours races on the same files and truncates
      # `.crate` extractions mid-write (observed: typenum/ring/libgit2-sys lost
      # source files → deterministic `clang: no such file` / `no X in the root`
      # build failures that are NOT our code). A dedicated CARGO_HOME is
      # untouchable by sibling jobs, so our extraction completes cleanly even while
      # another repo's CI storms — it kills the cross-repo corruption race by
      # construction (the durable fix for the PS-12b-class registry flake).
      # Set BEFORE rust-cache + taiki-e so both target the isolated home.
      - name: isolate cargo home
        run: |
          mkdir -p "$HOME/.cargo-hugit-ci"
          echo "CARGO_HOME=$HOME/.cargo-hugit-ci" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          # `prefix-key` busts the prior cache: a `cache-on-failure` experiment
          # saved a registry/target snapshot DURING a sibling-repo CI storm that
          # truncated a `.crate` extraction (ring-0.17.14 lost its pregenerated
          # `*.S`), poisoning every restore into a DETERMINISTIC build failure.
          # Bumping the key forces one clean fetch+build (default save-on-success
          # only), which then re-seeds a healthy cache. Do NOT re-enable
          # cache-on-failure: under contention it persists truncated artifacts.
          prefix-key: "v2-cibust-20260615"

      - uses: taiki-e/install-action@0631aa6515c7d545823c67cfae7ef4fc7f490154  # v2
        with:
          tool: cargo-audit,cargo-deny

      # Every gate step resolves its OWN toolchain PATH rather than trusting the
      # toolchain action's `$GITHUB_PATH` entry — that propagation is intermittently
      # lost per-step on the shared self-hosted runner: BOTH `cargo: command not
      # found` (the rustup `cargo` *proxy* at `~/.cargo/bin` vanishes on this box —
      # observed in `deny`/`test` while `fmt`/`clippy` in the SAME run found it) AND
      # `no such command: audit` (the proxy's external-subcommand search does not
      # reliably consult `~/.cargo/bin`). ~37% PS-12b-class infra flake, NEVER a real
      # lint/test/advisory failure. The deterministic close: prepend the DIRECT
      # toolchain bin (real `cargo`/`rustc`/`rustfmt`/`cargo-clippy` binaries that do
      # not vanish), then `$CARGO_HOME/bin` (the isolated home above, where taiki-e
      # and the fallback `cargo install` place `cargo-deny`/`cargo-audit`) +
      # `/usr/local/bin`; invoke the advisory tools as their OWN binaries (not via
      # the flaky proxy dispatch) with a self-healing reinstall guard.
      - name: fmt
        run: |
          export PATH="$(echo "$HOME"/.rustup/toolchains/1.96.0-*/bin):$CARGO_HOME/bin:/usr/local/bin:$PATH"
          cargo fmt --all --check

      - name: clippy
        run: |
          export PATH="$(echo "$HOME"/.rustup/toolchains/1.96.0-*/bin):$CARGO_HOME/bin:/usr/local/bin:$PATH"
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: |
          export PATH="$(echo "$HOME"/.rustup/toolchains/1.96.0-*/bin):$CARGO_HOME/bin:/usr/local/bin:$PATH"
          cargo test --workspace --locked

      - name: deny
        run: |
          export PATH="$(echo "$HOME"/.rustup/toolchains/1.96.0-*/bin):$CARGO_HOME/bin:/usr/local/bin:$PATH"
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
          cargo-deny check

      - name: audit
        run: |
          export PATH="$(echo "$HOME"/.rustup/toolchains/1.96.0-*/bin):$CARGO_HOME/bin:/usr/local/bin:$PATH"
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo-audit audit --deny warnings

      - name: changelog gate
        if: github.event_name == 'pull_request'
        run: .github/scripts/changelog-gate.sh "${{ github.event.pull_request.base.sha }}" HEAD

  # Gate extension: compile workspace on same Windows host class used by release.
  # Compiler is oracle; v0.1.5 release found Unix-only assumptions Linux CI missed.
  windows-check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      - name: check workspace on Windows
        run: cargo check --workspace --locked
      - name: test atomic writes on Windows
        run: cargo test -p hugit-cli pr::filelock::tests --locked
