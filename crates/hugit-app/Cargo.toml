[package]
name = "hugit-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-refstore = { path = "../hugit-refstore" }
# PR-6: hugit-app-sidecar removed (dead — superseded by hugit-contracts::IntentSidecar).
# hugit-app-exit kept (PR-8 hardens it in-place — not deleted).
serde = { workspace = true }
serde_json = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { version = "1", features = ["v4"] }
thiserror = { workspace = true }
# The single blocking HTTP seam for the Checks-API write-back (mirrors the
# `ureq` transport split in hugit-mirror's `auth`/`lease_client`). Already in the
# workspace lock — adds no new lock line.
ureq = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
hugit-refstore = { path = "../hugit-refstore" }

[[test]]
name = "acceptance_wp_b1"
path = "tests/acceptance_wp_b1.rs"
