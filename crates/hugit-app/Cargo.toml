[package]
name = "hugit-app"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-refstore = { path = "../hugit-refstore" }
hugit-app-sidecar = { path = "sidecar" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[dev-dependencies]
serde_json = "1"
hugit-refstore = { path = "../hugit-refstore" }

[[test]]
name = "acceptance_wp_b1"
path = "tests/acceptance_wp_b1.rs"
