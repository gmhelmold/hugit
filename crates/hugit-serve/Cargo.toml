[package]
name = "hugit-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
license-file.workspace = true

# The `/v1` HTTP engine port (githugr window ⇄ hugit engine), Wave 1.
#
# This crate is the INTEGRATOR/adapter: it maps the domain-pure engine crates'
# state into the frozen UI-shaped wire view-models (`hugit-http-contracts`) and
# serves them over a minimal SYNCHRONOUS HTTP server (added in the scaffold step;
# NOT axum/tokio — the workspace is supply-chain-strict + async-free). The
# VM-coupling (humanized strings, pt-BR, presentation) lives ONLY here; the engine
# core stays headless + clean.
#
# Deps are exactly what the handlers + scaffold use (dead engine deps trimmed per
# the SOTA audit). The HTTP server is `tiny_http` — a minimal SYNCHRONOUS server
# with NO async runtime and NO TLS (`default-features = false`: TLS terminates at
# the edge/Cloudflare), keeping the supply-chain surface small in this
# exact-pinned, `multiple-versions = "deny"` workspace.

[dependencies]
hugit-http-contracts = { path = "../hugit-http-contracts" }
hugit-refstore       = { path = "../hugit-refstore" }
hugit-contracts      = { path = "../hugit-contracts" }
hugit-ledger         = { path = "../hugit-ledger" }
hugit-cli            = { path = "../hugit-cli" }
# The git read seam: `resolve_blob_at_path` + `CasObjectSource` for the
# `GET /v1/repos/{repo}/blob|edit/{*path}` content handlers (reverses the PS-18
# deferral — actually serving file content from a git tree).
hugit-proto          = { path = "../hugit-proto" }
# `ObjectId` is `gix_hash::ObjectId` (the canonical git oid type the proto read
# path is keyed by). Named directly for the `AppState.git_root_tree` field; the
# version is pinned to the same `0.22` hugit-proto already resolves, so the
# `multiple-versions = "deny"` ban is not tripped (no new transitive gix-* line).
gix-hash   = "0.22"
tiny_http  = { version = "0.12.0", default-features = false }
sha2       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
# R2 read source (engine-storage Option A): hand-rolled AWS SigV4 over the
# existing crypto pins (zero new crypto dep) + the sync `ureq` client for the
# S3 GET. TLS is required OUTBOUND here (R2 is https) — distinct from the
# tiny_http server, which stays TLS-free (edge terminates inbound).
hmac       = { workspace = true }
hex        = { workspace = true }
# `ureq` serves BOTH the R2 S3 GET (read source) AND the outbound
# `POST /v1/session/exchange` call for `/v1/token` (Option B — hugit forwards the
# Clerk JWT to CoreLink rather than validating it locally). TLS is required
# outbound; the inbound tiny_http server stays TLS-free (edge terminates).
ureq       = { workspace = true }

[dev-dependencies]
hugit-refstore = { path = "../hugit-refstore", features = ["test-support"] }
tiny_http   = { version = "0.12.0", default-features = false }
serde_json = { workspace = true }
