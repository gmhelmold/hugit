[package]
name = "hugit-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-checks = { path = "../hugit-checks" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hugit-contracts = { path = "../hugit-contracts" }
serde_json = "1"
