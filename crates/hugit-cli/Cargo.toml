[package]
name = "hugit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-checks = { path = "../hugit-checks" }
hugit-queue = { path = "../hugit-queue" }
hugit-refstore = { path = "../hugit-refstore" }
# WP-PC1: the campaign porcelain drives the F3 rollup + Ledger projection.
# WP-PC3: `hugit pr show` reads the F3 `pr_record` rollup for the cost block.
hugit-ledger = { path = "../hugit-ledger" }
sha2 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# WP-R-cli: the real `hugit` binary. Pinned to an EXACT version (`=`) so the
# supply-chain invariant (X4) holds — no floating version drift on the CLI
# entrypoint.
clap = { version = "=4.6.1", features = ["derive"] }

# The real `hugit` binary (remediation R-cli defect #1). Library + bin in one
# crate: the bin is a thin dispatch shell over the existing library verbs.
[[bin]]
name = "hugit"
path = "src/main.rs"

[dev-dependencies]
hugit-contracts = { path = "../hugit-contracts" }
# C4-F1: test fixtures build synthetic event logs via the `test-support`
# raw-append shim; the production raw door stays `pub(crate)`.
hugit-refstore = { path = "../hugit-refstore", features = ["test-support"] }
# WP-PC3 acceptance: drive `pr open/land/show` over the REAL event log
# (EventLog) and the REAL landing queue (LandableEntry / Batch) — no
# hand-faked queue or projection state.
hugit-queue = { path = "../hugit-queue" }
serde_json = { workspace = true }

# WP-D9: the attention-queue oracle lives under the module's own tests/ dir
# (per WP-D9 Claims: crates/hugit-cli/attention/tests/), so it needs an explicit
# test target — non-default path.
[[test]]
name = "acceptance_d9"
path = "attention/tests/acceptance_d9.rs"
