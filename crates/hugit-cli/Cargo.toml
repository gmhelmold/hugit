[package]
name = "hugit-cli"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-checks = { path = "../hugit-checks" }
hugit-queue = { path = "../hugit-queue" }
hugit-refstore = { path = "../hugit-refstore" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WP-R-cli: the real `hugit` binary. Pinned to an EXACT version (`=`) so the
# supply-chain invariant (X4) holds — no floating version drift on the CLI
# entrypoint.
clap = { version = "=4.6.1", features = ["derive"] }

# The real `hugit` binary (remediation R-cli defect #1). Library + bin in one
# crate: the bin is a thin dispatch shell over the existing library verbs.
[[bin]]
name = "hugit"
path = "src/main.rs"

[dev-dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-refstore = { path = "../hugit-refstore" }
serde_json = "1"

# WP-D9: the attention-queue oracle lives under the module's own tests/ dir
# (per WP-D9 Claims: crates/hugit-cli/attention/tests/), so it needs an explicit
# test target — non-default path.
[[test]]
name = "acceptance_d9"
path = "attention/tests/acceptance_d9.rs"
