[package]
name = "hugit-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
# WP-F2 envelope producer: redact-on-write reuses the established X3
# redaction code path (hugit_ledger::redact — the REDACTED_MARKER policy),
# never a re-implementation.
hugit-ledger = { path = "../hugit-ledger" }
anyhow = { workspace = true }
# The envelope blob behind context_ref is serialized here (WP-F2).
serde_json = { workspace = true }
# Content-addressed cold-store refs (cas:<sha256-hex>) — workspace-pinned.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
