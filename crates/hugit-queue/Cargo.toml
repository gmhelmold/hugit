[package]
name = "hugit-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
serde = { workspace = true }

# Live-GitHub lane (App JWT mint + installations + merge API) is exercised only
# by the acceptance test, so its transport/crypto deps are dev-only — the
# library stays lean and the production audit surface minimal.
[dev-dependencies]
serde_json = { workspace = true }
jsonwebtoken = "9"
ureq = { workspace = true }

[[test]]
name = "acceptance_wp-b4b"
path = "tests/acceptance_wp-b4b.rs"

[[test]]
name = "acceptance_c10"
path = "tests/acceptance_c10.rs"
