[package]
name = "hugit-checks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
hugit-contracts = { path = "../hugit-contracts" }
hugit-queue = { path = "../hugit-queue" }
# R0 single-source: the canonical hash-chain / attestation-preimage formulas
# live ONLY in hugit-refstore (compute_this_hash + attestation_sig_preimage).
# The D12 gate routes through them so its events verify against the D1 chain and
# its attestations sign over the byte-exact frozen pre-image — never a bespoke
# re-transcription (brutal-review R1).
hugit-refstore = { path = "../hugit-refstore" }
# Real ASYMMETRIC signature for the D12 attestation (item ④ provenance closure):
# the private key signs, the public key alone verifies — a keyed-MAC would let
# any verifier forge. Pinned exact; already a workspace dep via hugit-invariants/x2.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# B2a (checks client): the three-axis memo key derives its tree_root/def_digest
# axes with the SAME SHA-256 + lowercase-hex the canonical formula uses; the
# final key is single-sourced via hugit_refstore::compute_memo_key. Already a
# workspace dep via hugit-refstore — no new transitive surface.
sha2 = { workspace = true }
hex = { workspace = true }
# B2a HTTP seam (P2 transport): the live AC client speaks CoreLink's REST AC
# surface (`{GET,PUT} /v1/ac/{tenant}/{action_digest}`, Bearer PAT). `ureq` is
# already in the workspace lock (hugit-queue) — no new transitive surface; the
# network call is the only deferred piece, behind a mockable transport trait.
ureq = { workspace = true }

[dev-dependencies]
# The D12 acceptance oracle (acceptance_d12) independently recomputes the
# canonical this_hash and verifies the attestation signature with the PUBLIC
# key — so it needs the same crypto/canonical-formula crates as the gate.
hugit-refstore = { path = "../hugit-refstore" }
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# The CoreLink AC config-loader oracle (ac_loader) points the PAT secret-file
# path at a temp file so it never touches the real ~/.hugit. Already in the
# workspace lock (transitive via gix-tempfile) — no new transitive surface.
tempfile = "3"
# O-1 (T-8): property/fuzz coverage for the three-axis memo key over GENERATED
# (tree, def, toolchain) tuples (not just hand-picked fixtures).
# `default-features = false` drops proptest's fork/timeout machinery
# (rusty-fork) — in-process, minimal transitive surface, `cargo deny`-clean.
proptest = { version = "1", default-features = false, features = ["std"] }

[[test]]
name = "acceptance_c8"
path = "tests/acceptance_c8.rs"

[[test]]
name = "acceptance_b2a"
path = "tests/acceptance_b2a.rs"

[[test]]
name = "acceptance_b2b"
path = "tests/acceptance_b2b.rs"

[[test]]
name = "ac_http"
path = "tests/ac_http.rs"

[[test]]
name = "ac_loader"
path = "tests/ac_loader.rs"

[[test]]
name = "corelink_ac_smoke"
path = "tests/corelink_ac_smoke.rs"

[[test]]
name = "proptest_memo_key"
path = "tests/proptest_memo_key.rs"
