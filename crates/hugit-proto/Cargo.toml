[package]
name = "hugit-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Refs are the D1 event-log derived view — consumed, never owned here.
hugit-refstore = { path = "../hugit-refstore" }
# EventRecord envelope — D3b's write path appends external-change events to the
# D1 log; consumed frozen from the contracts crate, never redefined here.
hugit-contracts = { path = "../hugit-contracts" }
# libgit2-class git library (gitoxide): canonical object hashing + pack format.
# We wire it to CAS-backed object access; we do NOT reimplement git's wire bits.
gix-hash = "0.22"
gix-object = "0.55"
gix-pack = "0.65"
gix-packetline = { version = "0.21", features = ["blocking-io"] }
thiserror = { workspace = true }
# zlib inflate for the push WRITE path: a received git object's verbatim on-disk
# loose bytes are zlib-compressed; the CoreLink CAS stores the UNCOMPRESSED
# `<kind> <len>\0<body>` framing keyed by blake3, so the receive→CAS adapter must
# inflate the loose bytes back to that pre-image (`inflate_loose_framing`). The
# system `git` binary does the unpack; this crate does the one inflate. Pure-Rust
# (miniz_oxide) backend; already in the lock transitively (via `ureq`), so no new
# crate/version — `multiple-versions = "deny"` stays satisfied.
flate2 = { workspace = true }

[dev-dependencies]
# Real libgit2 (the C library, via the git2 wrapper) — TEST-ONLY, never shipped
# in the product binary. Used by acceptance_d2b item ③ to prove the served pack
# is cloneable by a real libgit2 client (not just construction-equivalence).
# libgit2 is built vendored from source (no linkable system lib on this host).
# Pinned >=0.21 to clear RUSTSEC-2026-0183/0184 (git2 0.20 Remote::list/BlameHunk
# unsoundness); test-only, but the advisory gate (`cargo deny`) flags any version.
git2 = "0.21"
