[package]
name = "hugit-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
# Refs are the D1 event-log derived view — consumed, never owned here.
hugit-refstore = { path = "../hugit-refstore" }
# EventRecord envelope — D3b's write path appends external-change events to the
# D1 log; consumed frozen from the contracts crate, never redefined here.
hugit-contracts = { path = "../hugit-contracts" }
# libgit2-class git library (gitoxide): canonical object hashing + pack format.
# We wire it to CAS-backed object access; we do NOT reimplement git's wire bits.
gix-hash = "0.22"
gix-object = "0.55"
gix-pack = "0.65"
gix-packetline = { version = "0.21", features = ["blocking-io"] }
thiserror = { workspace = true }

[dev-dependencies]
# Real libgit2 (the C library, via the git2 wrapper) — TEST-ONLY, never shipped
# in the product binary. Used by acceptance_d2b item ③ to prove the served pack
# is cloneable by a real libgit2 client (not just construction-equivalence).
# libgit2 is built vendored from source (no linkable system lib on this host).
git2 = "0.20"
