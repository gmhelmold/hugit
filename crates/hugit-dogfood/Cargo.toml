[package]
name = "hugit-dogfood"
version = "0.1.0"
edition = "2024"
publish = false

# B8 dogfood harness: drives the full Phase-B stack end-to-end through
# the actual hugit-queue + hugit-checks + hugit-refstore surfaces. Consumes
# those crates as a CLIENT — ZERO production-crate modifications.

[dependencies]
# Frozen contract types (CheckResult, QueueApi, EventRecord, LandableEntry …)
hugit-contracts = { path = "../hugit-contracts" }
# Union-landing queue engine (core: batch/union/order/state + affected)
hugit-queue = { path = "../hugit-queue" }
# Checks client: memoized executor + ActionCache + memo-key (B2a)
hugit-checks = { path = "../hugit-checks" }
# Event-log: append, verify_chain, canonical_json, compute_memo_key
hugit-refstore = { path = "../hugit-refstore" }

serde_json = "1"

[dev-dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-queue     = { path = "../hugit-queue" }
hugit-checks    = { path = "../hugit-checks" }
hugit-refstore  = { path = "../hugit-refstore" }
serde_json      = "1"

[[test]]
name = "acceptance_b8"
path = "tests/acceptance_b8.rs"
