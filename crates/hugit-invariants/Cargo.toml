# hugit-invariants — Squad-X cross-cutting invariant test crate.
#
# Houses red-team / invariant suites that hold ACROSS production crates without
# owning any production path. WP-X4 is the supply-chain invariant: runner
# images are content-pinned + integrity-verified at spawn, App deps are pinned
# + verified in CI, and a tampered/unpinned image fails CLOSED before any
# tenant work. The crate consumes the spawn surface (hugit-runner / C2) and the
# frozen RunnerLease (hugit-contracts) read-only; it modifies neither.
#
# Layout note: the package root is `crates/hugit-invariants/`, but every source
# file lives under a per-WP subtree (`x4/`) so the WP-X4 claim ("only x4/ paths
# owned") is structurally enforced — nothing is written directly under the
# package root except this manifest.
[package]
name = "hugit-invariants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[lib]
name = "hugit_invariants"
# Root entry point wires all WP subtrees additively.
# x4/ and x5/ source dirs are owned by their respective WPs; this root file
# is the only cross-WP file under crates/hugit-invariants/ (not inside any WP dir).
path = "lib.rs"

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-runner = { path = "../hugit-runner" }
# WP-X5 (namespace law) consumes the REAL CLI verb registry
# (`hugit_cli::HUGIT_VERBS`) read-only — never a hand-copied list (which would
# rot). Deriving the no-shadow oracle from the single canonical registry makes
# "the oracle tests the real surface" structurally true: a git-shadowing verb
# added to hugit-cli turns the X5① oracle red automatically.
hugit-cli = { path = "../hugit-cli" }
anyhow = { workspace = true }
# WP-X2 (attestation e2e). Real ASYMMETRIC signature so verification is
# genuinely PUBLIC (item ③): the public key verifies, only the private key can
# sign — an HMAC keyed-MAC would fail this. ed25519-dalek is the audited,
# pure-Rust Ed25519 implementation; the frozen AttestationChain.sig field
# documents its format as a base64-encoded Ed25519 signature. The "no new
# external deps" rule is WAIVED by the lead specifically for this vetted crypto.
# Pinned exact. base64 (0.22) is already in the workspace lockfile (transitive);
# pinning it here adds no new supply-chain surface, only the documented encoding.
ed25519-dalek = { workspace = true }
base64 = { workspace = true }
# WP-X12 (erasure × provenance × mirror) consumes the canonical
# attestation/hash surface read-only — `compute_this_hash`, `verify_chain`,
# `canonical_json`, `EventLog` — so the post-erasure chain-verifiability oracle
# tests the REAL production hasher, never a re-transcribed copy (the divergence
# the 2026-06-07 brutal review R1 caught). serde derives the X12 tombstone +
# mirror-obligation + exit-proof types so the export/exit proof is a
# machine-validatable artifact.
hugit-refstore = { path = "../hugit-refstore" }
serde = { workspace = true }
serde_json = { workspace = true }
# WP-X13 (legibility × degradation/erasure) consumes the human-facing down-zoom
# surfaces read-only: deep links (D5 — `hugit_ledger::deeplink::resolve`) and
# `why` (D10 — `hugit_cli::why::resolver::resolve_why`, hugit-cli already a dep).
# Driving the REAL canonical resolvers makes "the oracle tests the real surface"
# structurally true: a regression in deep-link/`why` resolution turns the X13
# down-zoom oracle red automatically. hugit-ledger is promoted from a dev-only
# dep because x13/legibility.rs (production surface) links it.
hugit-ledger = { path = "../hugit-ledger" }
# WP-X1 (tenant isolation red-team) models the CoreLink HMAC-derived-prefix
# tenant boundary (whitepaper §9). The namespaced storage key is
# HMAC-SHA256(tenant_secret, base_memo_key); the base key itself comes from the
# single-source `hugit_refstore::compute_memo_key` (never re-transcribed).
# hmac (0.12) + sha2 (0.10) + hex (0.4) are already in the workspace lockfile
# (used by hugit-app + transitively by the hash chain), so pinning them here
# adds NO new supply-chain surface — only the documented HMAC namespace model.
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# WP-X10 (focus gate) SINGLE-SOURCES the dogfood allowlist + corelink-server
# exclusion from the PRODUCTION owner, `hugit_dogfood::focus_gate` — the module
# that actually enforces dogfood enrollment. X10 consumes it read-only instead
# of carrying a divergent copy, so the X10② oracle proves the REAL gate
# excludes corelink-server. No dependency cycle: hugit-dogfood depends only on
# contracts/queue/checks/refstore, never on hugit-invariants.
hugit-dogfood = { path = "../hugit-dogfood" }

[dev-dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-runner = { path = "../hugit-runner" }
# WP-X3 (context privacy) consumes the D11 journal + redaction surfaces and the
# frozen ExportSchema read-only. Dev-only: used by the x3 acceptance oracle.
hugit-ledger = { path = "../hugit-ledger" }
# WP-X12 acceptance oracle re-includes x12/erasure.rs via #[path] and drives the
# canonical refstore surface directly (verify_chain / compute_this_hash / EventLog).
hugit-refstore = { path = "../hugit-refstore" }
serde_json = { workspace = true }
serde = { workspace = true }

# The acceptance oracle lives under the x4/ subtree (not the default
# `tests/` dir) so all WP-X4 sources stay inside the owned claim. An explicit
# target is required because cargo only auto-discovers `tests/*.rs` at the
# package root.
[[test]]
name = "acceptance_x4"
path = "x4/tests/acceptance_x4.rs"

# WP-X3 acceptance oracle — context privacy (sources under x3/, oracle includes
# x3/privacy.rs via #[path]).
[[test]]
name = "acceptance_x3"
path = "x3/tests/acceptance_x3.rs"

# WP-X5: namespace-law invariants (no git-verb shadow, ref-namespace non-collision).
[[test]]
name = "acceptance_x5"
path = "x5/tests/acceptance_x5.rs"

# WP-X2: attestation end-to-end (sources under x2/, wired via #[path] in lib.rs).
[[test]]
name = "acceptance_x2"
path = "x2/tests/acceptance_x2.rs"

# WP-X6: resource non-interference — infra isolation config assertions +
# structural resource-accounting model + (live-gated) latency/availability
# measurement. Sources under x6/; the live lane is gated behind
# HUGIT_RUNNER_HOST + HUGIT_CORELINK_PROBE_URL; structural proof always runs.
[[test]]
name = "acceptance_x6"
path = "x6/tests/acceptance_x6.rs"
# WP-X10: focus gate — adjacent-product boundary (dogfood excludes
# corelink-server build-enforced, shared CoreLink API-tenancy non-interference,
# policy cap, fleet-scale load non-interference). Structural lane always runs;
# live lane (items ①④) gated behind HUGIT_CORELINK_PROD_URL + HUGIT_X10_LIVE.
[[test]]
name = "acceptance_x10"
path = "x10/tests/acceptance_x10.rs"

# WP-X12: erasure × provenance × mirror — post-erasure chain stays verifiable
# over a tamper-evident tombstone (no silent re-link), mirror obligation
# discharged-or-disclosed in the export/exit proof (sources under x12/, oracle
# includes x12/erasure.rs via #[path]).
[[test]]
name = "acceptance_x12"
path = "x12/tests/acceptance_x12.rs"
# WP-X8: self-release attestation — every App/CLI/runner-image release signed +
# published to a verifiable transparency log, the running App verifies its own
# provenance at boot, unsigned/tampered self-build fails CLOSED. Sources under
# x8/; wired via #[path] in lib.rs. Release signatures are real ed25519 over the
# contract-frozen canonical preimage (hugit_refstore::attestation_sig_preimage);
# the live public transparency log (e.g. Rekor) is the documented P2 seam behind
# the same TransparencyLog trait. Fully hermetic: no network, no env.
[[test]]
name = "acceptance_x8"
path = "x8/tests/acceptance_x8.rs"

# WP-X9: cross-phase object identity — a CheckResult memoized by phase-B is
# bit-identical to the one served as phase-D verdict evidence for the same
# (tree,def,toolchain); mismatch fails CLOSED + alerts; and the intent_id minted
# by a phase-B sidecar is identical+non-colliding with the native phase-D intent
# (one lifecycle, one id), divergence/collision fails CLOSED. Sources under x9/;
# the oracle includes x9/identity.rs via #[path] and drives the canonical
# refstore surface (canonical_json / compute_memo_key / compute_this_hash).
[[test]]
name = "acceptance_x9"
path = "x9/tests/acceptance_x9.rs"
# WP-X13: legibility × degradation/erasure — under a DEGRADED intelligence layer
# the human's down-zoom resolves via plain git OR fails honestly ("layer
# unavailable", never a silent 404/blank), and after an erasure cascade following
# any chain reaches an honest tombstone (never a broken link). Sources under
# x13/; the oracle includes x13/legibility.rs via #[path] and drives the real
# canonical deep-link / `why` / verify_chain surfaces.
[[test]]
name = "acceptance_x13"
path = "x13/tests/acceptance_x13.rs"

# WP-X14: deep-link referential integrity (lifecycle) — property test and
# standing fixture proving every ledger/intent deep link resolves to its target
# or to a tamper-evident tombstone across the full object lifecycle (compaction,
# mirror round-trip, tombstoning) with ZERO dangling links, ever.
[[test]]
name = "acceptance_x14"
path = "x14/tests/acceptance_x14.rs"

# WP-X1: tenant-isolation red-team — cross-tenant private lookup denied,
# forged/collision memo keys denied+alerted with no poisoning, public-
# deterministic artifacts shared leak-free, no private-artifact side-channel
# (sources under x1/, oracle includes x1/isolation.rs via #[path]).
[[test]]
name = "acceptance_x1"
path = "x1/tests/acceptance_x1.rs"

# WP-X7: right-to-erasure cascade — a data subject's personal data provably
# erased across CAS + provenance/ledger + context store + the GitHub mirror +
# the experiment corpus, with no orphaned provenance refs, attestation chains
# that re-seal OR fail CLOSED, and the erasure×seal precedence resolved
# (lawful corpus erasure permitted despite the seal, gate verdict invalidated
# fail-closed). Sources under x7/; oracle includes x7/cascade.rs via #[path].
# Closes the X3③ context-store-purge PARTIAL (the cross-store cascade it awaited).
[[test]]
name = "acceptance_x7"
path = "x7/tests/acceptance_x7.rs"

# WP-X11: degradation composition — the invariants COMPOSE under a PARTIAL
# degradation injected MID-operation (a degradation window, not a steady-state
# outage): ① the secrets broker fails CLOSED so no credential reaches any
# workspace during the window, ② objects written during degradation are marked
# provenance-ABSENT with ZERO fabricated synthetic intent/attestation, and ③ the
# CoreLink non-interference baseline (X10) holds WHILE degraded. Sources under
# x11/ (wired via #[path] in lib.rs). Hermetic in-process fault injection
# (FakeBox/FakeEngine pattern from X4); the LIVE box mid-op fault is the
# documented P2 seam gated behind HUGIT_RUNNER_HOST (run-not-skip when set).
[[test]]
name = "acceptance_x11"
path = "x11/tests/acceptance_x11.rs"
