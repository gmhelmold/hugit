[package]
name = "hugit-ledger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-refstore = { path = "../hugit-refstore" }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { version = "1", features = ["derive"] }
# WP-F2 envelope producer (relocated from hugit-runner, WP-R4): content-
# addressed cold-store refs (cas:<sha256-hex>) — workspace-pinned.
sha2 = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# C4-F1: ledger test fixtures build synthetic event logs via the `test-support`
# raw-append shim (the production raw door is `pub(crate)`).
hugit-refstore = { path = "../hugit-refstore", features = ["test-support"] }
# O-1 (T-8): property/fuzz coverage for the redaction scrubber over GENERATED
# inputs (not just hand-picked fixtures). `default-features = false` drops
# proptest's fork/timeout machinery (rusty-fork) — we run in-process, keeping
# the new transitive surface minimal and `cargo deny`-clean.
proptest = { version = "1", default-features = false, features = ["std"] }
