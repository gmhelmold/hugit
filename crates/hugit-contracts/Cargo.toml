[package]
name = "hugit-contracts"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }

[dev-dependencies]
# Test-only: independent recomputation of the frozen hash-chain / memo-key
# byte-format to pin it against drift (R0). Production hashing lives in
# hugit-refstore (the single canonical source); contracts has no runtime logic.
sha2 = "0.10"
hex = "0.4"
