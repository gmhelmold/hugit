[package]
name = "hugit-mirror"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true

[dependencies]
hugit-contracts = { path = "../hugit-contracts" }
hugit-refstore = { path = "../hugit-refstore" }
hugit-app = { path = "../hugit-app" }
# Bidir-sync consumes the D3⑤ raw-push→external-change recorder (never a
# fabricated intent) — the canonical ingest path, not re-transcribed here.
hugit-proto = { path = "../hugit-proto" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sha1 = "0.10"
hex = { workspace = true }

[features]
# Test-only surface (e.g. `AuthorityModel::set_github_authoritative_for_main`)
# used by acceptance RED-guards to CONSTRUCT a forbidden state and prove the
# rule-5 oracle rejects it. Never on by default → never in a production build of
# any dependent; enabled for the integration tests via the dev-dependency below.
test-internals = []

# Self dev-dependency with `test-internals` on: integration tests in `tests/`
# link the crate WITH the test-only surface, while production dependents do not.
[dev-dependencies]
hugit-mirror = { path = ".", features = ["test-internals"] }

[[test]]
name = "acceptance_e3"
path = "tests/acceptance_e3.rs"

[[test]]
name = "acceptance_e1a"
path = "tests/acceptance_e1a.rs"

[[test]]
name = "acceptance_e1b"
path = "tests/acceptance_e1b.rs"

[[test]]
name = "acceptance_e1c"
path = "tests/acceptance_e1c.rs"

[[test]]
name = "acceptance_e2a"
path = "tests/acceptance_e2a.rs"

[[test]]
name = "acceptance_e2b"
path = "tests/acceptance_e2b.rs"

[[test]]
name = "acceptance_bidir"
path = "tests/acceptance_bidir.rs"
