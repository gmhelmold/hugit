# cargo-deny configuration — supply-chain policy for hugit workspace.
# Run: cargo deny check

[licenses]
# Allow only these SPDX identifiers for dependency licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "BSD-3-Clause",
    "ISC",
    # webpki-roots (transitive via ureq) uses Community Data License Agreement
    "CDLA-Permissive-2.0",
    # zlib-rs (transitive via gix-features) uses the zlib/libpng license
    "Zlib",
]
# Our own crates are Apache-2.0 (workspace root); ignore them in the
# third-party license audit (they are first-party, not dependencies).
private = { ignore = true }

[bans]
# Deny multiple versions of the same crate …
multiple-versions = "deny"
# … except for well-known transitive-only duplicates we cannot collapse:

# wit-bindgen: wasip2 is a wasm32-only transitive dependency from gix.
[[bans.skip-tree]]
name = "wasip2"
version = "1.0.3"

# tree-sitter (hugit-symbols, symbol outline): its build-script's serde_json
# enables the `indexmap` feature, pulling indexmap 2.14 → hashbrown 0.17, which
# duplicates gix's hashbrown 0.16. Build-dep-only + transitive (we don't choose
# tree-sitter's bundled serde_json features); not collapsible from our side.
[[bans.skip-tree]]
name = "tree-sitter"
version = "0.26.9"

# getrandom: ring+uuid pin 0.2.x, jobserver (via cc) pins 0.3.x, while
# gix-tempfile and friends moved to 0.4.x. All transitive; none collapsible.
[[bans.skip]]
name = "getrandom"
version = "0.2"

[[bans.skip]]
name = "getrandom"
version = "0.3"

# r-efi: follows the getrandom 0.3/0.4 split (UEFI-target transitive only).
[[bans.skip]]
name = "r-efi"
version = "5"

# windows-sys 0.52 remains a transitive ecosystem duplicate.
[[bans.skip]]
name = "windows-sys"
version = "0.52"

[sources]
# Only allow dependencies from crates.io; deny unknown registries and git deps.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
