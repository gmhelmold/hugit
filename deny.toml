# cargo-deny configuration — supply-chain policy for hugit workspace.
# Run: cargo deny check

[licenses]
# Allow only these SPDX identifiers for dependency licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unlicense",
    "BSD-3-Clause",
    # arrayref (transitive via blake3, the git-from-CAS digest) uses BSD-2-Clause —
    # the more-permissive sibling of BSD-3-Clause (drops the non-endorsement clause),
    # OSI-approved + FSF-free, consistent with the permissive set already allowed.
    "BSD-2-Clause",
    "ISC",
    # webpki-roots (transitive via ureq) uses Community Data License Agreement
    "CDLA-Permissive-2.0",
    # zlib-rs (transitive via gix-features) uses the zlib/libpng license
    "Zlib",
]
# Our own crates are closed-source / no SPDX license — ignore them.
private = { ignore = true }

[bans]
# Deny multiple versions of the same crate …
multiple-versions = "deny"
# … except for well-known transitive-only duplicates we cannot collapse:

# wit-bindgen: wasip2 requires 0.57.1, wasip3 requires 0.51.0 (wasm32-only
# transitive deps from gix; we cannot control their pinned versions).
[[bans.skip-tree]]
name = "wasip2"
version = "1.0.3"

[[bans.skip-tree]]
name = "wasip3"
version = "0.4.0"

# getrandom: ring+uuid pin 0.2.x, jobserver (via cc) pins 0.3.x, while
# gix-tempfile and friends moved to 0.4.x. All transitive; none collapsible.
[[bans.skip]]
name = "getrandom"
version = "0.2"

[[bans.skip]]
name = "getrandom"
version = "0.3"

# r-efi: follows the getrandom 0.3/0.4 split (UEFI-target transitive only).
[[bans.skip]]
name = "r-efi"
version = "5"

# windows-sys: broad ecosystem split between 0.52/0.59 and 0.61.
[[bans.skip]]
name = "windows-sys"
version = "0.52"

[[bans.skip]]
name = "windows-sys"
version = "0.59"

[sources]
# Only allow dependencies from crates.io; deny unknown registries and git deps.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
